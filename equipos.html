<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listado de Equipos - Gestión Soccer</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="dashboard-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>Gestión Deportiva</h2>
                <span class="admin-badge">ADMIN PANEL</span>
            </div>

            <nav class="sidebar-nav">
                <ul>
                    <li class="nav-section-title">Dashboard</li>
                    <li><a href="federaciones.html" class="nav-link">Federaciones</a></li>
                    <li><a href="equipos.html" class="nav-link active">Equipos</a></li>
                    <li><a href="jugadores.html" class="nav-link">Jugadores</a></li>
                </ul>
            </nav>

            <div class="sidebar-footer">
                <a href="configuracion.html" class="nav-link">⚙️ Configuración</a>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="content-header">
                <h1>Listado de Equipos</h1>
                <button class="btn-primary" onclick="nuevoEquipo()">+ Nuevo Equipo</button>
            </header>

            <!-- Quick Actions -->
            <div class="quick-actions">
                <button class="btn-action" onclick="inscribirEquipo()">
                    ➕ Inscribir Equipo
                </button>
                <button class="btn-action" onclick="registrarJugador()">
                    ➕ Registrar Jugador
                </button>
            </div>

            <!-- Search Bar -->
            <div class="search-container">
                <input type="text" id="searchInput" placeholder="Buscar equipos..." class="search-input">
            </div>

            <!-- Teams Table -->
            <div class="table-container">
                <table class="teams-table">
                    <thead>
                        <tr>
                            <th>NOMBRE DEL EQUIPO</th>
                            <th>FEDERACIÓN</th>
                            <th>JUGADORES</th>
                            <th>ACCIONES</th>
                        </tr>
                    </thead>
                    <tbody id="equiposTableBody">
                        <!-- Teams will be loaded here -->
                    </tbody>
                </table>
            </div>

            <!-- Pagination -->
            <div class="pagination">
                <button id="prevPage" class="btn-secondary" onclick="changePage(-1)">Anterior</button>
                <span id="pageInfo">Página 1</span>
                <button id="nextPage" class="btn-secondary" onclick="changePage(1)">Siguiente</button>
            </div>
        </main>
    </div>

    <!-- Modal for New Team -->
    <div id="equipoModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Nuevo Equipo</h2>
                <span class="close" onclick="closeModal()">&times;</span>
            </div>
            <form id="equipoForm" class="modal-form">
                <input type="hidden" id="equipoId" name="id">
                <div class="form-group">
                    <label for="equipoNombre">Nombre del Equipo</label>
                    <input type="text" id="equipoNombre" name="nombre" required>
                </div>
                <div class="form-group">
                    <label for="federacionId">Federación</label>
                    <select id="federacionId" name="federacion_id" required>
                        <!-- Federations will be loaded here -->
                    </select>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn-secondary" onclick="closeModal()">Cancelar</button>
                    <button type="submit" class="btn-primary">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
