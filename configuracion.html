<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuración - Gestión Soccer</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="settings-container">
        <div class="settings-card">
            <div class="settings-header">
                <h1>Configuración</h1>
            </div>

            <div class="settings-body">
                <div class="settings-section">
                    <h2>Administrar</h2>
                    <span class="role-badge">Super Admin</span>
                </div>

                <div class="settings-menu">
                    <h3>AJUSTES DE CUENTA</h3>
                    <ul>
                        <li><a href="#" class="settings-link">Información Personal</a></li>
                        <li><a href="#" class="settings-link">Cambiar Contraseña</a></li>
                    </ul>

                    <h3>CONFIGURACIÓN DE FEDERACIÓN</h3>
                    <ul>
                        <li><a href="#" class="settings-link">Editar Federación</a></li>
                        <li><a href="#" class="settings-link">Gestionar Roles</a></li>
                    </ul>
                </div>

                <div class="settings-actions">
                    <button class="btn-danger" onclick="cerrarSesion()">
                        Cerrar Sesión
                    </button>
                </div>
            </div>
        </div>
    </div>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
</body>
</html>
